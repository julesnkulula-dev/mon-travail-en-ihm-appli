<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rehoboth services - Paiement</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="phone-container">
        <div class="notch"></div>
        <div class="page-content">
            <header class="app-header">
                <a href="page2.html" class="back-link"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg></a>
                <h2>Paiement Sécurisé</h2>
            </header>

            <div class="info-strip">
                <p id="summaryText">Récapitulatif: 1 article(s) - Total à Payer: 45,00 €</p>
            </div>

            <form class="checkout-form" onsubmit="event.preventDefault(); alert('Transaction effectuée !');">
                <div class="method-box">
                    <input type="radio" id="visa" name="method" checked>
                    <label for="visa" class="method-label">VISA / Mastercard</label>
                    <div class="method-brands">
                        <span class="brand-pill visa-style">VISA</span>
                        <span class="brand-pill mc-style">MC</span>
                    </div>
                </div>

                <div class="method-box disabled">
                    <input type="radio" id="mobile" name="method">
                    <label for="mobile" class="method-label">Mobile Money</label>
                    <div class="method-brands">
                        <span class="brand-pill m-pill airtel-bg">Airtel</span>
                        <span class="brand-pill m-pill mpesa-bg">M-Pesa</span>
                         <span class="brand-pill m-pill orange-bg">Orange Money</span>
                    </div>
                </div>
                <div class="form-row">
                    <label>Numéro de téléphone</label>
                    <input type="text" class="form-input" placeholder="+243 00 00 00 000" required>
                </div>
                <div class="form-row">
                    <label>Numéro de carte</label>
                    <input type="text" class="form-input" placeholder="43 04 60 08 070" required>
                </div>

                <div class="split-columns">
                    <div class="form-row">
                        <label>Date d'expiration</label>
                        <input type="text" class="form-input" placeholder="12/29" required>
                    </div>
                    <div class="form-row">
                        <label>CVC</label>
                        <input type="text" class="form-input" placeholder="123" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary btn-submit-payment">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    Payer <span id="priceButton"></span>
                </button>
            </form>
        </div>
        
        <nav class="bottom-nav">
            <a href="index.html" class="nav-link"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></a>
            <a href="catalogue.html" class="nav-link"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></a>
            <a href="catalogue.html" class="nav-link"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg></a>
    </div>
    <script src="script/script.js"></script>
</body>
</html>
