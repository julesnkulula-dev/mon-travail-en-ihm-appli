<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rehoboth services-Catalogue</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="phone-container">
        <div class="notch"></div>
        <div class="page-content">
            <header class="catalog-header">
                <div class="search-title-row">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <h2>Notre Collection</h2>
                </div>
                <div class="chips-row">
                    <button class="filter-chip active">Divers</button>
                    <button class="filter-chip ">Press</button>
                    <button class="filter-chip ">Impression</button>
                    <button class="filter-chip">Réalisation</button>
                </div>
            </header>

            <div class="grid-container">
                <div class="item-card">
                    <img src="images/images_catalogue1.jpg" class="item-media" alt="Produit 1">
                    <div class="item-details">
                        <span class="item-title">Trophée</span>
                        <span class="item-price">69000Fc</span>
                        <button class="btn-buy-action" onclick="addItem(69000)">Ajouter au Panier</button>
                    </div>
                </div>
                <div class="item-card">
                    <img src="images/images_catalogue2.jpg" class="item-media" alt="Produit 2">
                    <div class="item-details">
                        <span class="item-title">Stylos</span>
                        <span class="item-price">2500Fc</span>
                        <button class="btn-buy-action" onclick="addItem(2500)">Ajouter au Panier</button>
                    </div>
                </div>
                <div class="item-card">
                    <img src="images/images_catalogue3.jpg" class="item-media" alt="Produit 3">
                    <div class="item-details">
                        <span class="item-title">Les chapeaux</span>
                        <span class="item-price">5000Fc</span>
                        <button class="btn-buy-action" onclick="addItem(5000)">Ajouter au Panier</button>
                    </div>
                </div>
                <div class="item-card">
                    <img src="images/images_catalogue4.jpg" class="item-media" alt="Produit 4">
                    <div class="item-details">
                        <span class="item-title">Press à Chaud</span>
                        <span class="item-price">950000Fc</span>
                        <button class="btn-buy-action" onclick="addItem(950000)">Ajouter au Panier</button>
                    </div>
                </div>
            </div>

            <div class="sticky-summary">
                <div class="summary-text">
                    <h4>Ma Commande</h4>
                    <p id="totalDisplay">0 article | Total: 0 Fc</p>
                </div>
                <a href="paiement.html" id="nextLink" class="btn-primary btn-validate-order">Valider la commande</a>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-link"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></a>
            <a href="paiement.html" class="nav-link active"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></a>
            <a href="paiement.html" class="nav-link active"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg></a>
            <a href="profil_compte.html" class="nav-link"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></a>
        </nav>
    </div>
    <script src="script/script.js"></script>
</body>
</html>
